<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>ヘビしばき。</title>
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.PNG">
<link rel="icon" type="image/png" href="./apple-touch-icon.PNG">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="へびしばき">

<style>
:root{--ink:#3b291f;--cream:#fff8df;--red:#e94c45;--green:#65a94f;--gold:#f7c744}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:#efe1ba;color:var(--ink);overflow-x:hidden}
body{min-height:100svh;background:radial-gradient(circle at 50% 10%,#fff7d9 0 20%,transparent 45%),linear-gradient(#9bd9ef 0 35%,#9bc96e 35% 100%)}
button{font:inherit}
.wrap{width:min(100%,520px);min-height:100svh;margin:auto;position:relative;padding:16px 14px 24px}
.panel{background:rgba(255,252,236,.94);border:4px solid #fff;border-radius:28px;box-shadow:0 12px 30px #54351f35;padding:18px}
h1{font-size:clamp(38px,12vw,62px);margin:5px 0 0;text-align:center;letter-spacing:-.08em;text-shadow:0 4px #fff}
.sub{text-align:center;font-weight:900;margin:5px 0 18px}
.players{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.player{border:4px solid transparent;border-radius:24px;background:#fff;padding:8px;box-shadow:0 6px 14px #5c43282b;position:relative}
.player.selected{border-color:var(--gold);transform:translateY(-3px)}
.player img{width:100%;aspect-ratio:1/1;object-fit:contain}
.player b{display:block;font-size:20px}
.start,.again{width:100%;border:0;border-bottom:6px solid #a62f2b;border-radius:18px;background:var(--red);color:#fff;font-weight:1000;font-size:24px;padding:14px;margin-top:18px}
.note{text-align:center;font-size:13px;font-weight:700;margin-top:12px}
#game,#result{display:none}
.hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-bottom:8px}
.badge{background:#fff9e6;border:3px solid #fff;border-radius:18px;padding:7px 10px;font-weight:1000;box-shadow:0 4px 10px #0002}
#score{text-align:left}#timer{text-align:right}
#playerMini{width:70px;height:70px;object-fit:contain;filter:drop-shadow(0 5px 4px #0003)}
.stage{position:relative;height:min(70svh,640px);min-height:500px;border:5px solid #fff7d9;border-radius:28px;overflow:hidden;background:
radial-gradient(ellipse at 16% 24%,#5b371d 0 7%,#2b1c12 8% 10%,transparent 11%),
radial-gradient(ellipse at 50% 22%,#5b371d 0 7%,#2b1c12 8% 10%,transparent 11%),
radial-gradient(ellipse at 84% 24%,#5b371d 0 7%,#2b1c12 8% 10%,transparent 11%),
radial-gradient(ellipse at 16% 52%,#5b371d 0 7%,#2b1c12 8% 10%,transparent 11%),
radial-gradient(ellipse at 50% 50%,#5b371d 0 7%,#2b1c12 8% 10%,transparent 11%),
radial-gradient(ellipse at 84% 52%,#5b371d 0 7%,#2b1c12 8% 10%,transparent 11%),
radial-gradient(ellipse at 16% 80%,#5b371d 0 7%,#2b1c12 8% 10%,transparent 11%),
radial-gradient(ellipse at 50% 78%,#5b371d 0 7%,#2b1c12 8% 10%,transparent 11%),
radial-gradient(ellipse at 84% 80%,#5b371d 0 7%,#2b1c12 8% 10%,transparent 11%),
linear-gradient(#7ec55d,#5ea647)}
.target{position:absolute;width:29%;height:24%;display:grid;place-items:center;user-select:none;touch-action:manipulation;cursor:pointer;animation:pop .13s ease-out}
.target img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 5px 3px #0004)}
.emoji{font-size:clamp(54px,18vw,88px);filter:drop-shadow(0 5px 3px #0004)}
.snake{font-size:clamp(65px,21vw,104px)}
@keyframes pop{from{transform:scale(.15) translateY(50px)}to{transform:scale(1)}}
.hit{animation:whack .18s both}
@keyframes whack{to{transform:scale(.25) rotate(20deg);opacity:0}}
.float{position:absolute;z-index:20;font-weight:1000;font-size:24px;pointer-events:none;animation:float .7s forwards;text-shadow:0 2px #fff}
@keyframes float{to{transform:translateY(-60px) scale(1.3);opacity:0}}
.flash{position:absolute;inset:0;background:#fff8;z-index:18;pointer-events:none;animation:fade .18s forwards}
@keyframes fade{to{opacity:0}}
.bossveil{position:absolute;inset:0;background:#0008;z-index:30;display:grid;place-items:center}
.bossbox{text-align:center;color:#fff;width:96%}
.bossbox h2{font-size:42px;margin:0;color:#ffd83e;text-shadow:0 4px #9b1b17}
.bossbox img{width:min(90%,400px);max-height:420px;object-fit:contain;filter:drop-shadow(0 8px 10px #000)}
.bossbar{height:24px;background:#fff;border-radius:99px;overflow:hidden;margin:0 20px 10px}
.bossbar i{display:block;height:100%;width:100%;background:#e64b43;transition:.08s}
.bosshelp{font-weight:1000;font-size:18px}
#bossTap{touch-action:manipulation}
.resultTitle{text-align:center;font-size:38px;margin:4px 0}
.bigscore{text-align:center;font-size:68px;font-weight:1000;color:var(--red);line-height:1}
.judge{text-align:center;font-size:24px;font-weight:1000;margin:15px 0}
.breakdown{background:#fff;border-radius:18px;padding:12px 16px;font-weight:800;line-height:1.8}
.small{font-size:12px;opacity:.75}
.shake{animation:shake .18s}
@keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}

.comboBadge{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:25;background:#fff7d9;border:3px solid #fff;border-radius:999px;padding:6px 14px;font-weight:1000;display:none}
.whacker{position:absolute;z-index:45;width:31%;height:31%;object-fit:contain;pointer-events:none;animation:slam .28s ease-out forwards;filter:drop-shadow(0 7px 5px #0005)}
@keyframes slam{0%{transform:translate(-30px,-60px) rotate(-35deg) scale(.55);opacity:0}65%{opacity:1;transform:rotate(8deg) scale(1.05)}100%{transform:rotate(15deg) scale(.9);opacity:0}}
.roachRunner{position:absolute;z-index:16;font-size:64px;cursor:pointer;touch-action:manipulation;filter:drop-shadow(0 5px 3px #0005);animation:roachrun 2.1s linear forwards}
@keyframes roachrun{from{left:-80px}25%{transform:rotate(20deg) translateY(25px)}50%{transform:rotate(-15deg) translateY(-15px)}75%{transform:rotate(25deg) translateY(20px)}to{left:110%}}
.mirokuStop{position:absolute;inset:0;z-index:60;background:#000c;display:grid;place-items:center;text-align:center;color:#fff;padding:25px}.mirokuStop img{width:min(55%,220px)}.mirokuStop b{display:block;font-size:29px;margin:8px}.mirokuStop span{font-weight:900}
.frenzy{position:absolute;inset:0;z-index:55;pointer-events:none;border:10px solid #ffd32a;animation:frenzy .25s infinite alternate}@keyframes frenzy{to{border-width:20px;filter:hue-rotate(60deg)}}
.eventText{position:absolute;z-index:56;top:38%;left:4%;right:4%;text-align:center;font-size:35px;font-weight:1000;color:#fff;text-shadow:0 4px #d22,0 0 14px #000;pointer-events:none;animation:eventpop .9s forwards}@keyframes eventpop{0%{transform:scale(.2)}35%{transform:scale(1.15)}100%{opacity:0}}

.bossbox img.bossDodge{transition:.08s;position:relative}
.bossTaunt{font-weight:1000;font-size:21px;min-height:30px;color:#fff;background:#d93636;border:3px solid #fff;border-radius:999px;padding:5px 12px;display:inline-block;margin:4px}
.fakeBoss{position:absolute;z-index:31;width:30%;filter:drop-shadow(0 7px 6px #000);animation:fakepop .35s}
@keyframes fakepop{0%{transform:scale(.1)}60%{transform:scale(1.1)}100%{transform:scale(1)}}
.bossbox .bossName{font-size:16px;font-weight:1000;letter-spacing:.12em}
</style>
</head>
<body>
<main class="wrap">
<section id="select" class="panel">
<h1>ヘビしばき。</h1>
<p class="sub">誰でしばく？ 🔨</p>
<div class="players">
<button class="player selected" data-name="うめこ" data-img="UMEKO.PNG"><img src="UMEKO.PNG" alt="うめこ"><b>うめこ</b></button>
<button class="player" data-name="ゆきこ" data-img="YUKIKO.PNG"><img src="YUKIKO.PNG" alt="ゆきこ"><b>ゆきこ</b></button>
</div>
<button id="start" class="start">しばきに行く</button>
<p class="note">🐍 ヘビ +10　🪳 ゴキブリ +3<br>みろくまんは叩いたらアカン −30</p>
</section>

<section id="game">
<div class="hud">
<div id="score" class="badge">0点</div>
<img id="playerMini" src="UMEKO.PNG" alt="">
<div id="timer" class="badge">30秒</div>
</div>
<div id="stage" class="stage"><div id="comboBadge" class="comboBadge"></div></div>
</section>

<section id="result" class="panel">
<h2 class="resultTitle">しばき終了。</h2>
<div id="finalScore" class="bigscore">0</div>
<div id="judge" class="judge"></div>
<div id="breakdown" class="breakdown"></div>
<button id="again" class="again">もう一回しばく</button>
</section>
</main>
<script>
(()=>{
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
const select=$('#select'), game=$('#game'), result=$('#result'), stage=$('#stage');
let player={name:'うめこ',img:'UMEKO.PNG'}, score=0,time=30,running=false,spawnTimer,countTimer;
let stats={snake:0,fast:0,roach:0,miroku:0,boss:0}, bossDone=false; let combo=0,maxCombo=0,paused=false,frenzyDone=false;
const spots=[
[2,10],[35.5,8],[69,10],[2,38],[35.5,36],[69,38],[2,66],[35.5,64],[69,66]
];
$$('.player').forEach(b=>b.onclick=()=>{
 $$('.player').forEach(x=>x.classList.remove('selected')); b.classList.add('selected');
 player={name:b.dataset.name,img:b.dataset.img};
});
$('#start').onclick=startGame; $('#again').onclick=()=>{result.style.display='none';select.style.display='block'};
function startGame(){
 score=0;time=30;running=true;bossDone=false;paused=false;frenzyDone=false;combo=0;maxCombo=0;stats={snake:0,fast:0,roach:0,miroku:0,boss:0};
 select.style.display='none';result.style.display='none';game.style.display='block';
 $('#playerMini').src=player.img; updateHud(); stage.innerHTML='<div id="comboBadge" class="comboBadge"></div>';
 spawn(); spawnTimer=setInterval(spawn,650);
 countTimer=setInterval(()=>{if(paused)return;time--;updateHud();if(time===18&&!frenzyDone)frenzy();if(time===8&&!bossDone)bossFight();if(time<=0)finish()},1000);
}
function updateHud(){ $('#score').textContent=score+'点';$('#timer').textContent=time+'秒' }
function spawn(){
 if(!running||paused||stage.querySelector('.bossveil'))return;
 if(stage.querySelectorAll('.target').length>=4)return;
 const r=Math.random();if(r<.14){spawnRoach();return}
 let type=r<.70?'snake':r<.82?'fast':'miroku';
 const el=document.createElement('div');el.className='target';el.dataset.type=type;
 const [x,y]=spots[Math.floor(Math.random()*spots.length)];el.style.left=x+'%';el.style.top=y+'%';
 if(type==='snake')el.innerHTML='<span class="emoji snake">🐍</span>';
 if(type==='fast')el.innerHTML='<span class="emoji snake" style="filter:drop-shadow(0 0 9px #ff0)">🐍</span>';
 if(type==='miroku')el.innerHTML='<img src="MIROKUMAN.PNG" alt="みろくまん">';
 el.addEventListener('pointerdown',hit,{once:true});stage.appendChild(el);
 setTimeout(()=>el.remove(),type==='fast'?390:850)
}
function spawnRoach(){
 const el=document.createElement('div');el.className='roachRunner';el.textContent='🪳';el.style.top=(15+Math.random()*70)+'%';
 el.addEventListener('pointerdown',e=>{if(!running||paused)return;stats.roach++;goodHit(e,3,'+3');el.remove()},{once:true});
 stage.appendChild(el);setTimeout(()=>el.remove(),2200)
}
function hit(e){
 if(!running||paused)return;const el=e.currentTarget,type=el.dataset.type;
 if(type==='miroku'){stats.miroku++;score-=30;combo=0;updateCombo();updateHud();hammer(e);el.remove();mirokuPenalty();return}
 let pts=type==='fast'?20:10;if(type==='fast')stats.fast++;else stats.snake++;
 goodHit(e,pts,'+'+pts);el.classList.add('hit');setTimeout(()=>el.remove(),170)
}
function goodHit(e,base,msg){
 combo++;maxCombo=Math.max(maxCombo,combo);let mult=combo>=10?2:combo>=5?1.5:1;
 score+=Math.round(base*mult);updateHud();updateCombo();hammer(e);floatText(msg+(mult>1?' ×'+mult:''),e.clientX,e.clientY);
 if(combo===3)shout('ええぞ！');if(combo===5)shout('いてまえ！');if(combo===10)shout('しばき神 降臨')
}
function updateCombo(){const c=$('#comboBadge');if(!c)return;if(combo>=2){c.style.display='block';c.textContent='🔥 '+combo+' COMBO'+(combo>=10?' ×2':combo>=5?' ×1.5':'')}else c.style.display='none'}
function hammer(e){const r=stage.getBoundingClientRect(),w=document.createElement('img');w.className='whacker';w.src=player.img;w.style.left=Math.max(-10,Math.min(r.width-120,e.clientX-r.left-65))+'px';w.style.top=Math.max(-10,Math.min(r.height-130,e.clientY-r.top-85))+'px';stage.appendChild(w);setTimeout(()=>w.remove(),300)}
function shout(t){const d=document.createElement('div');d.className='eventText';d.textContent=t;stage.appendChild(d);setTimeout(()=>d.remove(),950)}
function mirokuPenalty(){paused=true;const d=document.createElement('div');d.className='mirokuStop';d.innerHTML='<div><img src="MIROKUMAN.PNG"><b>……今、みろくまん叩いたな？</b><span>神聖なるみろくまんに −30点。</span></div>';stage.appendChild(d);setTimeout(()=>{d.remove();paused=false},1200)}
function frenzy(){frenzyDone=true;shout('⚠️ 全員集合タイム ⚠️');const f=document.createElement('div');f.className='frenzy';stage.appendChild(f);let n=0,iv=setInterval(()=>{if(!running){clearInterval(iv);return}spawn();spawn();if(++n>=7){clearInterval(iv);f.remove()}},260)}
function floatText(txt,cx,cy){
 const r=stage.getBoundingClientRect(),d=document.createElement('div');d.className='float';d.textContent=txt;
 d.style.left=Math.max(5,Math.min(r.width-150,cx-r.left-30))+'px';d.style.top=(cy-r.top-20)+'px';stage.appendChild(d);setTimeout(()=>d.remove(),750)
}
function bossFight(){
 bossDone=true;clearInterval(spawnTimer);$$('.target,.roachRunner').forEach(x=>x.remove());combo=0;updateCombo();shout('来るで……');
 const v=document.createElement('div');v.className='bossveil';
 v.innerHTML=`<div class="bossbox"><div class="bossName">＼ 呼んでへんのに来ました ／</div><h2>⚠️ BOSS 降臨 ⚠️</h2><div class="bossbar"><i id="bossHP"></i></div><div class="bosshelp">7秒で12回しばけ！</div><div id="bossTaunt" class="bossTaunt">捕まえてみぃ〜🤣</div><img id="bossTap" class="bossDodge" src="BOSS.PNG" alt="ボス"></div>`;
 stage.appendChild(v);let hp=12,left=7,hitCount=0;
 const boss=$('#bossTap'),help=v.querySelector('.bosshelp');
 boss.addEventListener('pointerdown',ev=>{
  if(hp<=0)return; hp--; hitCount++;
  $('#bossHP').style.width=(hp/12*100)+'%';
  stage.classList.add('shake');setTimeout(()=>stage.classList.remove('shake'),120);
  const lines=['痛いって！🤣','顔は商品やぞ！','暴力反対〜！','当たってへんし！','効いてませ〜ん🤣','今のノーカン！','話し合お？','その程度？','うめこ怖っ！','ゆきこ怖っ！'];
  const taunts=['遅い遅い〜🤣','そこちゃうで〜','ワシ元気〜✨','もっと本気出して？','あと何発かな〜？','捕まらんで〜'];
  floatText(lines[Math.floor(Math.random()*lines.length)],ev.clientX,ev.clientY);hammer(ev);
  $('#bossTaunt').textContent=taunts[Math.floor(Math.random()*taunts.length)];
  // Every third hit the boss dodges sideways/up-down.
  if(hp>0 && hitCount%3===0){
    boss.style.transform=`translate(${Math.round((Math.random()-.5)*150)}px,${Math.round((Math.random()-.5)*80)}px) rotate(${Math.round((Math.random()-.5)*18)}deg)`;
  }
  // Mid-fight decoy: fake boss briefly appears elsewhere.
  if(hp===6){
    const fake=document.createElement('img');fake.src='BOSS.PNG';fake.className='fakeBoss';
    fake.style.left=(5+Math.random()*55)+'%';fake.style.top=(15+Math.random()*45)+'%';
    fake.addEventListener('pointerdown',e=>{score-=10;updateHud();floatText('そっちはニセモノ〜🤣 −10',e.clientX,e.clientY);fake.remove()},{once:true});
    stage.appendChild(fake);setTimeout(()=>fake.remove(),1600);
  }
  if(hp===0){
    score+=150;stats.boss=1;updateHud();
    $('#bossTaunt').textContent='……今日はこの辺にしといたるわ。';
    help.textContent='撃破！ +150点';
    boss.style.transform='scale(1.3) rotate(12deg)';
    setTimeout(()=>{v.remove();if(running)spawnTimer=setInterval(spawn,500)},1200)
  }
 });
 const bt=setInterval(()=>{
 left--;
 if(hp>0){
   help.textContent=`あと${left}秒！ 残り${hp}発`;
   if(left===4)$('#bossTaunt').textContent='時間なくなってきたで〜🤣';
   if(left===2)$('#bossTaunt').textContent='ほらほら焦れ焦れ〜🤣';
 }
 if(left<=0){
   clearInterval(bt);
   if(hp>0){
     $('#bossTaunt').textContent='はい時間切れ〜〜〜🤣';
     help.textContent='BOSS「出直しておいで♡」';
     boss.style.transform='translateY(-20px) rotate(-12deg) scale(1.15)';
     setTimeout(()=>{v.remove();if(running)spawnTimer=setInterval(spawn,500)},1100)
   }
 }
},1000);
}
function finish(){
 if(!running)return;running=false;clearInterval(spawnTimer);clearInterval(countTimer);stage.innerHTML='';game.style.display='none';result.style.display='block';
 $('#finalScore').textContent=score+'点';
 let j=score<=50?'ヘビに気ぃ遣いすぎ。':score<=150?'まあまあ仕留めた。':score<=250?'ヘビ界で指名手配。':'もう山に入らん方がええ。';
 $('#judge').textContent=player.name+'判定：'+j;
 let title=maxCombo>=15?'しばきの申し子':maxCombo>=10?'近所で噂のしばき屋':maxCombo>=5?'しばき見習い':'ヘビ界の平和主義者';$('#breakdown').innerHTML=`🏆 称号　${title}<br>🔥 最大コンボ　${maxCombo}<br>🐍 ヘビ　${stats.snake}匹<br>⚡ 高速ヘビ　${stats.fast}匹<br>🪳 爆走ゴキブリ　${stats.roach}匹<br>🌼 みろくまん誤爆　${stats.miroku}回 × −30点<br>👑 ウザBOSS撃破　${stats.boss?'成功 +150点':'逃げられた'}<br><span class="small">5コンボから×1.5、10コンボから×2。</span>`;
}
})();
</script>
</body>
</html>
